name: LucyLab Review TTS

on:
  push:
    branches: [main]
    paths: ['automation/tts_review/jobs/*.json']
  workflow_dispatch:
    inputs:
      job_path:
        description: Immutable review TTS request path
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lucylab-review-tts
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media probe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Resolve immutable review requests
        env:
          REQUEST_PATH: ${{ inputs.job_path }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          explicit = os.environ.get('REQUEST_PATH', '')
          if explicit:
              paths = [explicit]
          else:
              paths = subprocess.check_output(['git','diff-tree','--no-commit-id','--name-only','--diff-filter=A','-r','HEAD']).decode().splitlines()
              paths = [p for p in paths if p.startswith('automation/tts_review/jobs/') and p.endswith('.json')]
          assert paths, 'No newly added review TTS request'
          for p in paths:
              assert Path(p).parent.as_posix() == 'automation/tts_review/jobs' and Path(p).suffix == '.json'
          Path('requests.json').write_text(json.dumps(paths))
          PY
      - name: Synthesize natural review voice
        env:
          LUCYLAB_API_KEY: ${{ secrets.LUCYLAB_API_KEY }}
        run: python automation/tts_review/run_job.py --requests requests.json --out tts_review_output
      - name: Upload exact review output and checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucylab-review-${{ github.run_id }}
          path: tts_review_output/
          retention-days: 30
          if-no-files-found: warn
