name: Whiteboard Local Alignment Dependencies

on:
  push:
    branches: [main]
    paths: ['.github/workflows/whiteboard-local-alignment-deps.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download wheels and public alignment model (no media or secrets)
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          mkdir -p wheels model-parts
          python -m pip download --only-binary=:all: --dest wheels faster-whisper==1.2.1 socksio==1.0.0
          python -m pip install 'huggingface-hub>=0.25,<1'
          python - <<'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path
          import hashlib, json, shutil, tarfile
          snapshot_download('Systran/faster-whisper-small', local_dir='model', allow_patterns=['config.json', 'model.bin', 'tokenizer.json', 'vocabulary.json', 'preprocessor_config.json'])
          shutil.rmtree('model/.cache', ignore_errors=True)
          with tarfile.open('model.tar.gz', 'w:gz') as tar:
              tar.add('model', arcname='model')
          manifest = {'model':'Systran/faster-whisper-small','archiveSha256':hashlib.sha256(Path('model.tar.gz').read_bytes()).hexdigest(),'parts':[]}
          with open('model.tar.gz','rb') as stream:
              i=0
              while True:
                  data=stream.read(80*1024*1024)
                  if not data:break
                  name=f'part-{i:02d}'
                  Path('model-parts',name).write_bytes(data)
                  manifest['parts'].append({'name':name,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data)})
                  i+=1
          Path('wheels/model-manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wb-align-wheels-${{ github.run_id }}
          path: wheels/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wb-align-model-00-${{ github.run_id }}
          path: model-parts/part-00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wb-align-model-01-${{ github.run_id }}
          path: model-parts/part-01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wb-align-model-02-${{ github.run_id }}
          path: model-parts/part-02
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wb-align-model-03-${{ github.run_id }}
          path: model-parts/part-03
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wb-align-model-04-${{ github.run_id }}
          path: model-parts/part-04
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wb-align-model-05-${{ github.run_id }}
          path: model-parts/part-05
          compression-level: 0
          retention-days: 7
