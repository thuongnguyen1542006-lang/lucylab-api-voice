name: HANDU Temp Font Artifact
on:
  push:
    paths:
      - '.github/workflows/handu-temp-font-artifact.yml'
jobs:
  fetch-font:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Be Vietnam Pro Bold
        run: |
          mkdir -p out
          curl -L --fail 'https://raw.githubusercontent.com/google/fonts/main/ofl/bevietnampro/BeVietnamPro-Bold.ttf' -o out/BeVietnamPro-Bold.ttf
          sha256sum out/BeVietnamPro-Bold.ttf
      - uses: actions/upload-artifact@v4
        with:
          name: bevietnampro-bold
          path: out/BeVietnamPro-Bold.ttf
          retention-days: 1
