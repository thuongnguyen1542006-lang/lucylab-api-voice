name: HANDU Douyin Fetch

on:
  push:
    branches: [main]
    paths: ['automation/handu_fetch/jobs/*.json']
  workflow_dispatch:
    inputs:
      job_path:
        description: Fetch job JSON path
        required: true
        type: string

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader
        run: |
          python -m pip install -U "yt-dlp[default,curl-cffi]" requests
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Resolve job
        id: job
        env:
          REQUEST_PATH: ${{ inputs.job_path }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p=os.environ.get("REQUEST_PATH","").strip()
          if not p:
              paths=subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","--diff-filter=AM","-r","HEAD"]).decode().splitlines()
              paths=[x for x in paths if x.startswith("automation/handu_fetch/jobs/") and x.endswith(".json")]
              if paths:
                  p=paths[0]
              else:
                  jobs=sorted(Path("automation/handu_fetch/jobs").glob("*.json"), key=lambda x:x.stat().st_mtime, reverse=True)
                  assert jobs, "No fetch job found"
                  p=str(jobs[0])
          j=json.loads(Path(p).read_text())
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("url="+j["url"]+"\n")
              f.write("video_id="+str(j.get("video_id","douyin"))+"\n")
          PY
      - name: Download source
        env:
          SRC_URL: ${{ steps.job.outputs.url }}
          VID: ${{ steps.job.outputs.video_id }}
        run: |
          mkdir -p handu_fetch_output
          set +e
          yt-dlp --no-playlist --merge-output-format mp4 --retries 5 --fragment-retries 5             --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36"             -o "handu_fetch_output/source.%(ext)s" "$SRC_URL"
          code=$?
          set -e
          if [ $code -ne 0 ] || ! ls handu_fetch_output/source.* >/dev/null 2>&1; then
            echo "short-link download failed; trying canonical video URL"
            set +e
            yt-dlp --no-playlist --merge-output-format mp4 --retries 5 --fragment-retries 5 \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36" \
              -o "handu_fetch_output/source.%(ext)s" "https://www.douyin.com/video/$VID"
            code2=$?
            set -e
            if [ $code2 -ne 0 ] || ! ls handu_fetch_output/source.* >/dev/null 2>&1; then
              echo "canonical download failed; trying IES router fallback"
              python automation/handu_fetch/fetch_ies.py "$VID"
            fi
          fi
          src=$(ls handu_fetch_output/source.* | head -1)
          if [ "$src" != "handu_fetch_output/source.mp4" ]; then
            ffmpeg -y -i "$src" -c copy handu_fetch_output/source.mp4 ||             ffmpeg -y -i "$src" -c:v libx264 -c:a aac handu_fetch_output/source.mp4
          fi
          ffprobe -v error -show_streams -show_format -of json handu_fetch_output/source.mp4 > handu_fetch_output/ffprobe.json
          sha256sum handu_fetch_output/source.mp4 > handu_fetch_output/sha256.txt
      - name: Upload source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handu-douyin-fetch-${{ github.run_id }}
          path: handu_fetch_output/
          retention-days: 7
          if-no-files-found: warn
