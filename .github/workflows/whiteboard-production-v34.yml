name: Whiteboard Production V3.4

on:
  push:
    branches: [main]
    paths:
      - 'automation/jobs/current.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: whiteboard-v34-${{ github.ref }}
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install V3.4 runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r automation/requirements-v34.txt
          ffmpeg -version
          ffprobe -version

      - name: Prepare drawing and eraser overlays
        run: |
          python automation/v34/prepare_overlay_assets.py

      - name: Resolve stage
        id: meta
        shell: bash
        run: |
          stage=$(python -c "import json; print(json.load(open('automation/jobs/current.json'))['stage'])")
          echo "stage=$stage" >> "$GITHUB_OUTPUT"
          if [ "$stage" = "timing" ]; then
            echo "artifact=whiteboard-v34-timing" >> "$GITHUB_OUTPUT"
          elif [ "$stage" = "production" ]; then
            echo "artifact=whiteboard-v34-current" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid stage: $stage" >&2
            exit 2
          fi

      - name: Download exact timing artifact
        if: steps.meta.outputs.stage == 'production'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          run_id=$(python -c "import json; j=json.load(open('automation/jobs/current.json')); print(j.get('timingRunId',''))")
          if [ -z "$run_id" ]; then
            echo 'JOB_CONTRACT_ERROR: production requires timingRunId' >&2
            exit 2
          fi
          mkdir -p timing_input
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n whiteboard-v34-timing -D timing_input
          test -f timing_input/audio/voice.wav
          test -f timing_input/audio/subtitles.srt
          test -f timing_input/timing/timing.json

      - name: Validate locked storyboard contract
        if: steps.meta.outputs.stage == 'production'
        run: |
          python automation/v34/validate_storyboard_contract.py automation/jobs/current.json

      - name: Validate ChatGPT Web source package
        if: steps.meta.outputs.stage == 'production'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          j=json.load(open('automation/jobs/current.json'))
          sb=j.get('storyboard') or {}
          assert sb.get('locked') is True, 'storyboard must be locked'
          for idx,page in enumerate(sb.get('pages', []), 1):
              assert page.get('sourceMethod') == 'chatgpt-web-image-generation'
              p=Path(page['sourcePath'])
              assert p.is_file() and p.stat().st_size > 1000, f'missing source image: {p}'
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  assert im.size == (1080,1920), f'page {idx} must be 1080x1920, got {im.size}'
              q=page.get('sourceVisualQc') or {}
              for key in ('approvedSketchStyle','notFlatVectorOrClipart','organicLineTexture','believableObjectDetail'):
                  assert q.get(key) is True, f'page {idx} sourceVisualQc.{key} must pass'
              if page.get('containsCharacter'):
                  assert q.get('matchesCharacterStyle') is True, f'page {idx} character style must pass'
          print('ChatGPT Web storyboard + source images: PASS')
          PY

      - name: Run V3.4
        env:
          LUCYLAB_API_KEY: ${{ secrets.LUCYLAB_API_KEY }}
          V34_TIMING_DIR: timing_input
        run: |
          python automation/v34/run_v34.py \
            --job automation/jobs/current.json \
            --out automation/output/current

      - name: Validate final project
        if: steps.meta.outputs.stage == 'production'
        run: |
          job_id=$(python -c "import json; print(json.load(open('automation/jobs/current.json'))['jobId'])")
          python automation/v34/validate_project.py "automation/output/current/$job_id"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: automation/output/current/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
