name: V3.4 Runner Self Test

on:
  push:
    branches: [main]
    paths:
      - 'automation/v34/**'
      - 'automation/requirements-v34.txt'
      - '.github/workflows/v34-self-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r automation/requirements-v34.txt
          ffmpeg -version
          ffprobe -version
      - name: Prepare and validate render overlays
        run: |
          python automation/v34/prepare_overlay_assets.py
          python - <<'PY'
          from PIL import Image
          for p in ['assets/drawing-hand.png','assets/eraser-hand.png']:
              im=Image.open(p); im.verify(); print(p, 'OK')
          PY
      - name: Run deterministic renderer self-test
        run: |
          python automation/v34/run_v34.py --self-test --out automation/output/selftest
          test -s automation/output/selftest/selftest/final/final.mp4
          test -s automation/output/selftest/selftest/qc/transition-contact-sheet.jpg
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate -of json automation/output/selftest/selftest/final/final.mp4
          ffmpeg -v error -i automation/output/selftest/selftest/final/final.mp4 -f null -
          python - <<'PY'
          import json
          q=json.load(open('automation/output/selftest/selftest/qc/v34-runner-qc.json'))
          assert q['pass'] is True
          assert q['eraserCleanupPass'] is True
          assert q['transitionResidualPixels'] == [0]
          print('V3.4 renderer QC: PASS')
          PY
      - name: Upload self-test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whiteboard-v34-selftest
          path: automation/output/selftest
          retention-days: 3
